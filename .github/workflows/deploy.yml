name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/home/limiria/public_html/wango"
            REPO_URL="https://github.com/QuratulainBabar/wwngo_backend.git"
            cd "$APP_DIR"

            if [[ ! -f .env ]]; then
              echo "ERROR: .env missing on server."
              exit 1
            fi

            if [[ ! -d .git ]]; then
              echo "Initializing git repo in $APP_DIR"
              git init
              git remote add origin "$REPO_URL"
            fi

            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git checkout -f -B main origin/main

            npm install --omit=dev
            npm run db:migrate

            echo "==> Restarting app"
            mkdir -p tmp
            touch tmp/restart.txt || true

            restarted=0
            if command -v pm2 >/dev/null 2>&1; then
              if pm2 describe wwngo >/dev/null 2>&1; then
                if pm2 restart wwngo --update-env; then
                  restarted=1
                fi
              else
                pkill -f "$APP_DIR/src/index.js" 2>/dev/null || true
                sleep 1
                if pm2 start "$APP_DIR/src/index.js" --name wwngo --cwd "$APP_DIR"; then
                  restarted=1
                fi
              fi
              pm2 save || true
            fi

            if [[ "$restarted" -ne 1 ]]; then
              echo "Falling back to nohup restart"
              pkill -f "$APP_DIR/src/index.js" 2>/dev/null || true
              sleep 1
              nohup npm start >>"$APP_DIR/app.log" 2>&1 &
              echo "Started with nohup (logs: $APP_DIR/app.log)"
            fi

            echo "==> Health check"
            ok=0
            for i in 1 2 3 4 5 6; do
              sleep 2
              if curl -fsS "https://wango.toolkitpro.cloud/health"; then
                echo
                ok=1
                break
              fi
              echo "Attempt $i failed, retrying..."
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "Health check failed"
              pm2 status || true
              tail -n 50 "$APP_DIR/app.log" 2>/dev/null || true
              exit 1
            fi
            echo "Deploy OK"
